[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Philbert/ archives the 5x5 coursework engine that agent.py was adapted
# from. It is a reference, not live code: nothing imports it and
# harness/package.py never ships it. Linting it is pure noise.
exclude = ["Philbert"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "harness"]
# The search in agent.py is deliberately unannotated: it is a hot loop that
# churns fast, and strict mypy on it costs more than it catches. The harness
# stays strict, which is where a type error would actually be dangerous.
[[tool.mypy.overrides]]
module = "agent"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
